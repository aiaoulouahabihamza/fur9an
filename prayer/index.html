<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الفرقان - مواقيت الصلاة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <link rel="stylesheet" href="/variables.css" />
    <link rel="stylesheet" href="/prayer/style.css" />
    <script src="../cordova.js"></script>
</head>
<body>

    <!-- ===== الشريط العلوي ===== -->
    <header class="main-header" id="mainHeader">
        <div class="header-content">
            <a href="/index.html" class="back-btn">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="header-title">
                <h1><i class="fa-solid fa-mosque"></i> أوقات الصلاة</h1>
                <span id="currentDate">--</span>
            </div>
            <button class="header-btn theme-toggle" id="themeToggle">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- ===== المحتوى ===== -->
    <main class="main-content">

        <!-- ===== الموقع ===== -->
        <div class="location-card">
            <div class="location-display">
                <i class="fa-solid fa-location-dot"></i>
                <span id="cityDisplay">جاري التحميل...</span>
                <button id="changeCityBtn" class="btn-icon">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <div class="location-status" id="locationStatus">
                <span class="status-dot"></span>
                <span class="status-text">جاري التحديث...</span>
            </div>
        </div>

        <!-- ===== الصلاة القادمة ===== -->
        <div class="next-prayer-card">
            <div class="next-prayer-header">
                <span>الصلاة القادمة</span>
                <i class="fa-regular fa-bell"></i>
            </div>
            <div class="next-prayer-name" id="nextPrayerName">--</div>
            <div class="next-prayer-countdown" id="nextPrayerCountdown">--:--:--</div>
            <div class="next-prayer-time" id="nextPrayerTime">--:--</div>
        </div>

        <!-- ===== قائمة الصلوات ===== -->
        <div class="prayer-times-grid">

            <!-- الفجر -->
            <div class="prayer-item" data-prayer="Fajr">
                <div class="prayer-icon p-fajr">
                    <i class="fa-solid fa-cloud-moon"></i>
                </div>
                <div class="prayer-info">
                    <span class="prayer-name">الفجر</span>
                    <span class="prayer-time" id="FajrTime">--:--</span>
                </div>
                <div class="prayer-remaining" id="FajrRemaining">--</div>
            </div>

            <!-- الظهر -->
            <div class="prayer-item" data-prayer="Dhuhr">
                <div class="prayer-icon p-dhuhr">
                    <i class="fa-solid fa-sun"></i>
                </div>
                <div class="prayer-info">
                    <span class="prayer-name">الظهر</span>
                    <span class="prayer-time" id="DhuhrTime">--:--</span>
                </div>
                <div class="prayer-remaining" id="DhuhrRemaining">--</div>
            </div>

            <!-- العصر -->
            <div class="prayer-item" data-prayer="Asr">
                <div class="prayer-icon p-asr">
                    <i class="fa-solid fa-cloud-sun"></i>
                </div>
                <div class="prayer-info">
                    <span class="prayer-name">العصر</span>
                    <span class="prayer-time" id="AsrTime">--:--</span>
                </div>
                <div class="prayer-remaining" id="AsrRemaining">--</div>
            </div>

            <!-- المغرب -->
            <div class="prayer-item" data-prayer="Maghrib">
                <div class="prayer-icon p-maghrib">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <div class="prayer-info">
                    <span class="prayer-name">المغرب</span>
                    <span class="prayer-time" id="MaghribTime">--:--</span>
                </div>
                <div class="prayer-remaining" id="MaghribRemaining">--</div>
            </div>

            <!-- العشاء -->
            <div class="prayer-item" data-prayer="Isha">
                <div class="prayer-icon p-isha">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <div class="prayer-info">
                    <span class="prayer-name">العشاء</span>
                    <span class="prayer-time" id="IshaTime">--:--</span>
                </div>
                <div class="prayer-remaining" id="IshaRemaining">--</div>
            </div>

        </div>

        <!-- ===== مشغل الأذان ===== -->
        <div class="adhan-player-section">
            <div class="adhan-title-info">
                <i class="fa-solid fa-volume-high"></i>
                <div class="adhan-text-wrapper">
                    <span class="adhan-title" id="selectedReciterTitle">أذان الحرم المكي الشريف</span>
                    <span class="adhan-desc">اختر مؤذنك المفضل للأذان والتشغيل في أندرويد</span>
                </div>
            </div>

            <!-- اختيار المؤذن من بين 3 أصوات -->
            <div class="reciter-select-wrapper">
                <label for="reciterSelect" class="reciter-label"><i class="fa-solid fa-user-ninja"></i> المؤذن:</label>
                <select id="reciterSelect" class="reciter-select">
                    <option value="makkah" selected>أذان الحرم المكي الشريف (على ملا)</option>
                    <option value="qatami">الشيخ ناصر القطامي</option>
                    <option value="afasy">الشيخ مشاري العفاسي</option>
                </select>
            </div>

            <div class="adhan-controls">
                <button class="btn-play-adhan" id="playAdhanBtn">
                    <i class="fa-solid fa-play"></i>
                    <span id="playAdhanText">تجربة الأذان</span>
                </button>
            </div>
        </div>

        <!-- ===== أذكار بعد الصلاة ===== -->
        <div class="prayer-azkar-section">
            <div class="azkar-header">
                <span class="azkar-title-main">
                    <i class="fa-solid fa-kaaba"></i> أذكار بعد الصلاة المفروضة
                </span>
                <div class="azkar-nav-btns">
                    <button class="btn-azkar-nav" id="prevAzkarBtn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button class="btn-azkar-nav" id="nextAzkarBtn">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>
            </div>
            
            <div class="azkar-slider-container" id="azkarSlider">
                <!-- سيتم ملء الأذكار برمجياً للتفاعلية التامة والتحكم بالعداد -->
            </div>
            
            <div class="azkar-progress-bar">
                <div class="azkar-progress-fill" id="azkarProgressFill"></div>
            </div>
        </div>

    </main>

    <!-- ===== مودال تغيير المدينة ===== -->
    <div class="modal-overlay" id="cityModal">
        <div class="modal-content city-modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-location-dot"></i> تغيير المدينة</h2>
                <button class="modal-close" id="cityModalClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="city-modal-body">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="cityModalInput" placeholder="ابحث عن مدينة..." />
                </div>
                <div class="city-suggestions" id="citySuggestions"></div>
                <div id="modalLocationStatus" style="display: none; padding: 10px; margin-bottom: 12px; border-radius: var(--radius); font-size: 13px; text-align: center; font-weight: 500; transition: var(--transition);"></div>
                <button type="button" id="detectLocationModalBtn" class="btn-primary full-width" style="margin-bottom: 16px;">
                    <i class="fa-solid fa-crosshairs"></i> تحديد الموقع تلقائيا
                </button>

                <div class="calc-method-wrapper" style="margin-top: 8px;">
                    <label for="calcMethodSelect" style="display: block; font-size: 13px; font-weight: 600; color: var(--color-text); margin-bottom: 8px;"><i class="fa-solid fa-calculator"></i> طريقة الحساب الفلكي:</label>
                    <select id="calcMethodSelect" class="reciter-select" style="width: 100%; margin-bottom: 8px;">
                        <option value="0" selected>الافتراضي (حسب البلد والموقع)</option>
                        <option value="4">أم القرى، مكة المكرمة</option>
                        <option value="5">الهيئة العامة المصرية للمساحة</option>
                        <option value="3">رابطة العالم الإسلامي</option>
                        <option value="2">الجمعية الإسلامية لأمريكا الشمالية (ISNA)</option>
                        <option value="1">جامعة العلوم الإسلامية، كراتشي</option>
                        <option value="8">منطقة الخليج</option>
                        <option value="9">دولة الكويت</option>
                        <option value="10">دولة قطر</option>
                        <option value="13">رئاسة الشؤون الدينية بتركيا</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="/cordova-bridge.js"></script>
    <script src="/prayer/main.js"></script>
</body>
</html>
