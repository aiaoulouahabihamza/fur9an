name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          
          # إنشاء مشروع كوردوفا جديد
          cordova create /tmp/app com.mishcat.app Mishkat
          
          # نقل ملفات www فقط (وليس config.xml)
          rm -rf /tmp/app/www/*
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='config.xml' \
              -cf - . | (cd /tmp/app/www && tar -xf -)
          
          # نسخ config.xml إلى جذر المشروع (وليس www)
          if [ -f config.xml ]; then
            cp config.xml /tmp/app/config.xml
            echo "Copied config.xml to project root"
          fi
          
          # نسخ مجلد data إلى جذر المشروع (مهم للأيقونات)
          if [ -d data ]; then
            cp -r data /tmp/app/data
            echo "Copied data folder to project root"
          fi
          
          # بناء التطبيق
          cd /tmp/app
          
          # تثبيت الإضافات يدوياً لضمان سلامة التثبيت والاعتمادية الكاملة قبل البناء
          echo "Installing Cordova plugins..."
          cordova plugin add cordova-plugin-geolocation --no-telemetry || true
          cordova plugin add cordova-plugin-statusbar --no-telemetry || true
          cordova plugin add cordova-plugin-splashscreen --no-telemetry || true
          
          # تم التحديث هنا للنسخة المتوافقة
          cordova plugin add cordova-plugin-local-notification-12 --no-telemetry || true
          
          cordova platform add android --no-telemetry
          cordova build android --debug --no-telemetry
          
          # نقل ملف APK
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp platforms/android/app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/artifacts/mishkat-debug.apk
          echo "Build completed successfully"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mishkat-debug-apk
          path: artifacts/mishkat-debug.apk

